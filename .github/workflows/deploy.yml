name: Deploy OpenStreetMap Website

# Disabled: This workflow is replaced by ci-ecr-deploy.yml
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Terraform code
        uses: actions/checkout@v4

      - name: Checkout Application code
        uses: actions/checkout@v4
        with:
          repository: dhamsey3/openstreetmap-website
          path: application

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./application

      - name: Package application
        run: zip -r my-application.zip .
        working-directory: ./application

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-central-1

      - name: Upload zip to S3
        run: aws s3 cp application/my-application.zip s3://openstreetmap-static-assets-${{ secrets.S3_BUCKET_SUFFIX }}/

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      # Comment out apply for now
      # - name: Terraform Apply
      #   run: terraform apply -auto-approve
