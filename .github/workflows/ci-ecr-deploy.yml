name: AWS CI/CD Deploy

on:
  push:
    branches:
      - main
      - at
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - at
          - pr

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: openstreetmap-website
  OSM_REPO: openstreetmap/openstreetmap-website
  OSM_PATH: openstreetmap-website
  TF_IN_AUTOMATION: true
  DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'at' && 'at' || 'dev') }}

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform security check
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform

  test:
    name: Rails test suite
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout OpenStreetMap website
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OSM_REPO }}
          path: ${{ env.OSM_PATH }}

      - name: Create Docker network
        run: docker network create ci_test_net || true

      - name: Start Postgres for tests
        run: |
          docker run -d --rm --name ci-postgres --net ci_test_net \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=openstreetmap \
            postgres:13

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: openstreetmap-website
          file: openstreetmap-website/Dockerfile
          push: false
          load: true
          tags: test-image:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            docker run --rm --net ci_test_net alpine sh -c "nc -z ci-postgres 5432 && echo ok" && break || sleep 2
          done

      - name: Run migrations and tests
        env:
          DATABASE_URL: postgresql://postgres@ci-postgres:5432/openstreetmap
          RAILS_ENV: test
          IMAGE: test-image:${{ github.sha }}
        run: |
          mkdir -p tmp/artifacts
          docker run --rm --name ci-test-run --net ci_test_net \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e RAILS_ENV="${RAILS_ENV}" \
            -v "${GITHUB_WORKSPACE}/tmp/artifacts:/app/coverage" \
            "${IMAGE}" \
            bash -lc "bundle exec rails db:create db:migrate RAILS_ENV=test && bundle exec rails test:all"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: tmp/artifacts

  prepare-ecr:
    name: Prepare ECR repository
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=openstreetmap/${{ env.DEPLOY_ENV }}.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Create or update ECR repository
        env:
          TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_region: ${{ env.AWS_REGION }}
          TF_VAR_ecr_repo_name: ${{ env.ECR_REPOSITORY }}
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
          TF_VAR_key_name: ${{ secrets.KEY_NAME }}
        run: terraform -chdir=terraform apply -input=false -auto-approve -target=aws_ecr_repository.app

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs:
      - test
      - prepare-ecr
    outputs:
      image: ${{ steps.image.outputs.image }}
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout OpenStreetMap website
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OSM_REPO }}
          path: ${{ env.OSM_PATH }}

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image reference
        id: image
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "${GITHUB_OUTPUT}"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: openstreetmap-website
          file: openstreetmap-website/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy infrastructure and image
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'at' && 'at' || 'dev') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=openstreetmap/${{ env.DEPLOY_ENV }}.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform plan
        env:
          TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_region: ${{ env.AWS_REGION }}
          TF_VAR_ecr_repo_name: ${{ env.ECR_REPOSITORY }}
          TF_VAR_image_tag: ${{ needs.build-and-push.outputs.image_tag }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
          TF_VAR_key_name: ${{ secrets.KEY_NAME }}
        run: terraform -chdir=terraform plan -input=false -out=tf.plan

      - name: Terraform apply
        env:
          TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_region: ${{ env.AWS_REGION }}
          TF_VAR_ecr_repo_name: ${{ env.ECR_REPOSITORY }}
          TF_VAR_image_tag: ${{ needs.build-and-push.outputs.image_tag }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
          TF_VAR_key_name: ${{ secrets.KEY_NAME }}
        run: terraform -chdir=terraform apply -input=false -auto-approve tf.plan
