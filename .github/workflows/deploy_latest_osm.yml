name: Deploy Latest OpenStreetMap Website

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-latest-osm:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPO: ${{ secrets.ECR_REPO }} # Set this secret to your ECR repo URL
      IMAGE_TAG: ${{ github.sha }}
      OSM_REPO_URL: https://github.com/openstreetmap/openstreetmap-website.git
      OSM_CLONE_DIR: openstreetmap-website
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4

      - name: Clone latest OSM website
        run: |
          git clone --depth 1 "$OSM_REPO_URL" "$OSM_CLONE_DIR"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t "$ECR_REPO:$IMAGE_TAG" "$OSM_CLONE_DIR"

      - name: Push Docker image to ECR
        run: |
          docker push "$ECR_REPO:$IMAGE_TAG"

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Plan
        run: |
          terraform -chdir=terraform plan \
            -out=tf.plan \
            -var="db_password=${DB_PASSWORD}" \
            -var="db_username=${DB_USERNAME}" \
            -var="db_name=${DB_NAME}" \
            -var="key_name=${KEY_NAME}" \
            -var="account_id=${ACCOUNT_ID}" \
            -var="image_tag=${IMAGE_TAG}"
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_NAME: ${{ secrets.DB_NAME }}
          KEY_NAME: ${{ secrets.KEY_NAME }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}

      - name: Terraform Apply
        run: terraform -chdir=terraform apply tf.plan
