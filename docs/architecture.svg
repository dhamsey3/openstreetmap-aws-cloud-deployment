<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">OpenStreetMap AWS Cloud Architecture</title>
  <desc id="desc">Professional AWS architecture diagram for the OpenStreetMap cloud deployment. Users enter through an internet-facing Application Load Balancer in public subnets. ECS Fargate tasks run in private application subnets and connect to RDS PostgreSQL in private data subnets. GitHub Actions builds and deploys immutable images through ECR, Terraform provisions infrastructure, and regional services provide secrets, logs, monitoring, autoscaling, TLS certificates, and ALB access log storage.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .page { fill: #f8fafc; }
      .header { fill: #0f172a; }
      .title { font: 800 44px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #475569; }
      .section-title { font: 800 24px Arial, sans-serif; fill: #1e293b; }
      .section-subtitle { font: 400 17px Arial, sans-serif; fill: #64748b; }
      .label { font: 800 19px Arial, sans-serif; fill: #334155; }
      .small { font: 400 16px Arial, sans-serif; fill: #64748b; }
      .tiny { font: 400 14px Arial, sans-serif; fill: #64748b; }
      .card-title { font: 800 20px Arial, sans-serif; fill: #0f172a; }
      .card-sub { font: 400 16px Arial, sans-serif; fill: #475569; }
      .badge { font: 800 15px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .outer { fill: #ffffff; stroke: #94a3b8; stroke-width: 3; rx: 28; filter: url(#shadow); }
      .region { fill: #fff7ed; stroke: #fb923c; stroke-width: 3; rx: 24; }
      .vpc { fill: #ecfdf5; stroke: #22c55e; stroke-width: 3; rx: 24; }
      .zone-public { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2.5; rx: 20; }
      .zone-app { fill: #fff7ed; stroke: #fdba74; stroke-width: 2.5; rx: 20; }
      .zone-data { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2.5; rx: 20; }
      .zone-services { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2.5; rx: 20; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .node-soft { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 18; }
      .orange { fill: #ff9900; }
      .blue { fill: #527fff; }
      .green { fill: #7aa116; }
      .purple { fill: #8c4fff; }
      .red { fill: #dd344c; }
      .dark { fill: #24292f; }
      .docker { fill: #2496ed; }
      .terraform { fill: #7b42bc; }
      .flow { fill: none; stroke: #334155; stroke-width: 4; marker-end: url(#arrow-dark); }
      .flow-soft { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow-dark); }
      .flow-deploy { fill: none; stroke: #b45309; stroke-width: 4; marker-end: url(#arrow-orange); }
      .flow-thin { fill: none; stroke: #94a3b8; stroke-width: 3; marker-end: url(#arrow-dark); }
      .line-label { font: 700 15px Arial, sans-serif; fill: #334155; }
      .deploy-label { font: 700 15px Arial, sans-serif; fill: #92400e; }
    </style>
  </defs>

  <rect class="page" width="2400" height="1500"/>

  <text x="80" y="82" class="title">OpenStreetMap AWS Cloud Architecture</text>
  <text x="80" y="122" class="subtitle">Production-oriented deployment with private compute, private database, CI/CD delivery, and managed AWS operations.</text>

  <!-- External systems -->
  <rect x="72" y="210" width="290" height="104" class="node"/>
  <circle cx="124" cy="262" r="30" class="blue"/>
  <text x="124" y="262" class="badge">USR</text>
  <text x="174" y="254" class="card-title">Users</text>
  <text x="174" y="282" class="card-sub">Browser traffic</text>

  <rect x="72" y="456" width="290" height="104" class="node"/>
  <circle cx="124" cy="508" r="30" class="dark"/>
  <text x="124" y="508" class="badge">GH</text>
  <text x="174" y="500" class="card-title">GitHub Actions</text>
  <text x="174" y="528" class="card-sub">Build, test, deploy</text>

  <rect x="72" y="604" width="290" height="104" class="node"/>
  <circle cx="124" cy="656" r="30" class="terraform"/>
  <text x="124" y="656" class="badge">TF</text>
  <text x="174" y="648" class="card-title">Terraform</text>
  <text x="174" y="676" class="card-sub">Provision infra</text>

  <rect x="72" y="1138" width="290" height="104" class="node"/>
  <circle cx="124" cy="1190" r="30" class="docker"/>
  <text x="124" y="1190" class="badge">DEV</text>
  <text x="174" y="1182" class="card-title">LocalStack</text>
  <text x="174" y="1210" class="card-sub">Local AWS validation</text>

  <!-- AWS account and region -->
  <rect x="420" y="172" width="1900" height="1194" class="outer"/>
  <text x="462" y="222" class="section-title">AWS Account</text>
  <text x="462" y="252" class="section-subtitle">OpenStreetMap cloud deployment</text>

  <rect x="462" y="292" width="1816" height="1028" class="region"/>
  <text x="504" y="342" class="section-title">Region: eu-central-1</text>
  <text x="504" y="372" class="section-subtitle">Application, data, security, and operations services</text>

  <!-- VPC -->
  <rect x="510" y="426" width="1186" height="806" class="vpc"/>
  <text x="552" y="476" class="section-title">VPC 10.0.0.0/16</text>
  <text x="552" y="506" class="section-subtitle">Public ingress tier, private application tier, and isolated database tier across two Availability Zones</text>

  <!-- Network edge -->
  <rect x="570" y="560" width="286" height="556" class="zone-public"/>
  <text x="602" y="604" class="label">Public Subnets</text>
  <text x="602" y="630" class="small">10.0.3.0/24, 10.0.4.0/24</text>

  <rect x="618" y="710" width="190" height="92" class="node"/>
  <circle cx="664" cy="756" r="28" class="green"/>
  <text x="664" y="756" class="badge">IGW</text>
  <text x="710" y="748" class="card-title">Internet</text>
  <text x="710" y="776" class="card-sub">Gateway</text>

  <rect x="618" y="842" width="190" height="106" class="node"/>
  <circle cx="664" cy="895" r="28" class="blue"/>
  <text x="664" y="895" class="badge">ALB</text>
  <text x="710" y="878" class="card-title">Application</text>
  <text x="710" y="906" class="card-title">Load Balancer</text>
  <text x="710" y="932" class="card-sub">:80 / optional :443</text>

  <rect x="618" y="988" width="190" height="92" class="node"/>
  <circle cx="664" cy="1034" r="28" class="green"/>
  <text x="664" y="1034" class="badge">NAT</text>
  <text x="710" y="1026" class="card-title">NAT</text>
  <text x="710" y="1054" class="card-sub">Gateway</text>

  <!-- Application tier -->
  <rect x="910" y="560" width="342" height="556" class="zone-app"/>
  <text x="942" y="604" class="label">Private App Subnets</text>
  <text x="942" y="630" class="small">10.0.5.0/24, 10.0.6.0/24</text>

  <rect x="964" y="688" width="234" height="100" class="node"/>
  <circle cx="1012" cy="738" r="30" class="orange"/>
  <text x="1012" y="738" class="badge">ECS</text>
  <text x="1062" y="730" class="card-title">ECS Cluster</text>
  <text x="1062" y="758" class="card-sub">Fargate launch type</text>

  <rect x="964" y="842" width="234" height="124" class="node"/>
  <circle cx="1012" cy="904" r="30" class="orange"/>
  <text x="1012" y="904" class="badge">APP</text>
  <text x="1062" y="884" class="card-title">Rails Web Task</text>
  <text x="1062" y="912" class="card-sub">Container :3000</text>
  <text x="1062" y="940" class="card-sub">Desired count 1+</text>

  <rect x="964" y="1014" width="234" height="92" class="node"/>
  <circle cx="1012" cy="1060" r="30" class="green"/>
  <text x="1012" y="1060" class="badge">LOG</text>
  <text x="1062" y="1052" class="card-title">VPC Flow Logs</text>
  <text x="1062" y="1080" class="card-sub">All traffic</text>

  <!-- Data tier -->
  <rect x="1304" y="560" width="322" height="556" class="zone-data"/>
  <text x="1336" y="604" class="label">Private Data Subnets</text>
  <text x="1336" y="630" class="small">RDS subnet group</text>

  <rect x="1362" y="842" width="206" height="124" class="node"/>
  <circle cx="1412" cy="904" r="30" class="purple"/>
  <text x="1412" y="904" class="badge">RDS</text>
  <text x="1462" y="884" class="card-title">RDS PostgreSQL</text>
  <text x="1462" y="912" class="card-sub">Multi-AZ</text>
  <text x="1462" y="940" class="card-sub">Encrypted storage</text>

  <!-- Regional services -->
  <rect x="1758" y="426" width="468" height="806" class="zone-services"/>
  <text x="1798" y="476" class="section-title">Regional Services</text>
  <text x="1798" y="506" class="section-subtitle">Managed platform capabilities outside the VPC</text>

  <rect x="1816" y="566" width="336" height="86" class="node-soft"/>
  <circle cx="1860" cy="609" r="26" class="orange"/>
  <text x="1860" y="609" class="badge">ECR</text>
  <text x="1904" y="601" class="card-title">Amazon ECR</text>
  <text x="1904" y="629" class="card-sub">Immutable container images</text>

  <rect x="1816" y="684" width="336" height="86" class="node-soft"/>
  <circle cx="1860" cy="727" r="26" class="red"/>
  <text x="1860" y="727" class="badge">SEC</text>
  <text x="1904" y="719" class="card-title">Secrets Manager</text>
  <text x="1904" y="747" class="card-sub">Database credentials</text>

  <rect x="1816" y="802" width="336" height="86" class="node-soft"/>
  <circle cx="1860" cy="845" r="26" class="purple"/>
  <text x="1860" y="845" class="badge">CW</text>
  <text x="1904" y="837" class="card-title">CloudWatch</text>
  <text x="1904" y="865" class="card-sub">Logs, metrics, alarms</text>

  <rect x="1816" y="920" width="336" height="86" class="node-soft"/>
  <circle cx="1860" cy="963" r="26" class="green"/>
  <text x="1860" y="963" class="badge">S3</text>
  <text x="1904" y="955" class="card-title">S3 ALB Logs</text>
  <text x="1904" y="983" class="card-sub">Encrypted access logs</text>

  <rect x="1816" y="1038" width="336" height="86" class="node-soft"/>
  <circle cx="1860" cy="1081" r="26" class="orange"/>
  <text x="1860" y="1081" class="badge">AS</text>
  <text x="1904" y="1073" class="card-title">Application Auto Scaling</text>
  <text x="1904" y="1101" class="card-sub">CPU, memory, request count</text>

  <rect x="1816" y="1156" width="336" height="86" class="node-soft"/>
  <circle cx="1860" cy="1199" r="26" class="red"/>
  <text x="1860" y="1199" class="badge">ACM</text>
  <text x="1904" y="1191" class="card-title">ACM Certificate</text>
  <text x="1904" y="1219" class="card-sub">Optional HTTPS listener</text>

  <!-- Main runtime path -->
  <path d="M362 262 H664 V710" class="flow"/>
  <text x="390" y="248" class="line-label">HTTP / HTTPS</text>

  <path d="M664 802 V842" class="flow"/>
  <text x="682" y="824" class="line-label">internet route</text>

  <path d="M808 895 H964" class="flow"/>
  <text x="832" y="878" class="line-label">target group :3000</text>

  <path d="M1081 788 V842" class="flow-thin"/>
  <path d="M1198 904 H1362" class="flow"/>
  <text x="1224" y="886" class="line-label">PostgreSQL 5432</text>

  <path d="M964 934 H842 V1034 H808" class="flow-soft"/>
  <text x="842" y="1020" class="line-label">private egress</text>

  <!-- Service dependencies -->
  <path d="M1198 880 H1716 V727 H1816" class="flow-thin"/>
  <text x="1454" y="710" class="line-label">read DB secret</text>

  <path d="M1198 924 H1716 V845 H1816" class="flow-thin"/>
  <path d="M1568 904 H1716 V845" class="flow-thin"/>
  <path d="M1198 1060 H1716 V845" class="flow-thin"/>
  <text x="1478" y="828" class="line-label">logs and metrics</text>

  <path d="M808 916 H1716 V963 H1816" class="flow-thin"/>
  <text x="1390" y="948" class="line-label">ALB access logs</text>

  <path d="M1816 1081 H1696 V904 H1198" class="flow-thin"/>
  <text x="1478" y="1064" class="line-label">scale desired count</text>

  <path d="M1816 1199 H1696 V895 H808" class="flow-soft"/>
  <text x="1390" y="1182" class="line-label">optional TLS</text>

  <!-- Delivery path -->
  <path d="M362 508 H1816 V609" class="flow-deploy"/>
  <text x="762" y="492" class="deploy-label">build and push image</text>

  <path d="M1816 609 H1081 V688" class="flow-deploy"/>
  <text x="1320" y="592" class="deploy-label">pull image</text>

  <path d="M362 508 H1081 V842" class="flow-deploy"/>
  <text x="706" y="536" class="deploy-label">register task definition and deploy</text>

  <path d="M362 656 H420 V222" class="flow-deploy"/>
  <text x="390" y="642" class="deploy-label">terraform apply</text>

  <path d="M362 1190 H462" class="flow-soft"/>
  <text x="392" y="1174" class="line-label">local validation</text>

  <!-- Legend -->
  <rect x="462" y="1262" width="980" height="70" class="node-soft"/>
  <line x1="500" y1="1288" x2="580" y2="1288" class="flow"/>
  <text x="604" y="1294" class="small">Runtime traffic / service dependency</text>
  <line x1="500" y1="1314" x2="580" y2="1314" class="flow-deploy"/>
  <text x="604" y="1320" class="small">CI/CD and Terraform delivery</text>
  <line x1="1018" y1="1288" x2="1098" y2="1288" class="flow-soft"/>
  <text x="1122" y="1294" class="small">Optional or local workflow</text>

  <text x="80" y="1432" class="subtitle">Static SVG companion to docs/architecture.eraser. Components reflect the Terraform resources and GitHub Actions workflow in this repository.</text>
</svg>
