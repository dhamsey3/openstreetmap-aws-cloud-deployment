<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">OpenStreetMap AWS Cloud Architecture</title>
  <desc id="desc">Professional AWS architecture diagram for OpenStreetMap cloud deployment. It shows users and GitHub Actions entering an AWS account, with a region, VPC, public subnets, private ECS Fargate application subnets, private RDS database subnets, and supporting AWS services including ECR, Secrets Manager, CloudWatch, S3, Auto Scaling, ACM, Internet Gateway, NAT Gateway, and VPC Flow Logs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#344054"/>
    </marker>
    <marker id="arrowDeploy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b54708"/>
    </marker>
    <style>
      .page { fill: #f8fafc; }
      .title { font: 700 30px Arial, sans-serif; fill: #101828; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #475467; }
      .boundary { fill: #ffffff; stroke: #98a2b3; stroke-width: 2; rx: 18; }
      .region { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 16; }
      .vpc { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 16; }
      .zone-public { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 14; }
      .zone-app { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; rx: 14; }
      .zone-data { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; rx: 14; }
      .zone-support { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; filter: drop-shadow(0 2px 4px rgba(16,24,40,.10)); }
      .label { font: 700 15px Arial, sans-serif; fill: #344054; }
      .small { font: 400 12px Arial, sans-serif; fill: #667085; }
      .node-title { font: 700 14px Arial, sans-serif; fill: #101828; }
      .node-sub { font: 400 12px Arial, sans-serif; fill: #667085; }
      .icon { font: 700 12px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .orange { fill: #ff9900; }
      .blue { fill: #527fff; }
      .green { fill: #7aa116; }
      .purple { fill: #8c4fff; }
      .red { fill: #dd344c; }
      .dark { fill: #24292f; }
      .line { fill: none; stroke: #344054; stroke-width: 2; marker-end: url(#arrow); }
      .line-muted { fill: none; stroke: #667085; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .line-deploy { fill: none; stroke: #b54708; stroke-width: 2; marker-end: url(#arrowDeploy); }
      .line-thin { fill: none; stroke: #98a2b3; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="page" width="1500" height="980"/>
  <text x="48" y="56" class="title">OpenStreetMap AWS Cloud Architecture</text>
  <text x="48" y="82" class="subtitle">Terraform-managed deployment with ECS Fargate, private RDS PostgreSQL, CI/CD delivery, and operational services.</text>

  <!-- External systems -->
  <rect x="48" y="190" width="190" height="72" class="node"/>
  <circle cx="84" cy="226" r="17" class="blue"/>
  <text x="84" y="226" class="icon">USR</text>
  <text x="112" y="221" class="node-title">Users</text>
  <text x="112" y="241" class="node-sub">HTTP / HTTPS</text>

  <rect x="48" y="404" width="190" height="72" class="node"/>
  <circle cx="84" cy="440" r="17" class="dark"/>
  <text x="84" y="440" class="icon">GH</text>
  <text x="112" y="435" class="node-title">GitHub Actions</text>
  <text x="112" y="455" class="node-sub">Build, test, deploy</text>

  <rect x="48" y="520" width="190" height="72" class="node"/>
  <circle cx="84" cy="556" r="17" fill="#7b42bc"/>
  <text x="84" y="556" class="icon">TF</text>
  <text x="112" y="551" class="node-title">Terraform</text>
  <text x="112" y="571" class="node-sub">Provision AWS infra</text>

  <rect x="48" y="778" width="190" height="72" class="node"/>
  <circle cx="84" cy="814" r="17" fill="#2496ed"/>
  <text x="84" y="814" class="icon">DEV</text>
  <text x="112" y="809" class="node-title">LocalStack</text>
  <text x="112" y="829" class="node-sub">Local validation</text>

  <!-- AWS account -->
  <rect x="280" y="126" width="1170" height="786" class="boundary"/>
  <text x="306" y="160" class="label">AWS Account</text>

  <rect x="314" y="184" width="1102" height="694" class="region"/>
  <text x="340" y="218" class="label">Region: eu-central-1</text>

  <!-- VPC -->
  <rect x="350" y="250" width="740" height="560" class="vpc"/>
  <text x="376" y="284" class="label">VPC 10.0.0.0/16</text>
  <text x="376" y="306" class="small">Two Availability Zones with public ingress and private application/database subnets</text>

  <rect x="386" y="342" width="178" height="340" class="zone-public"/>
  <text x="410" y="374" class="label">Public Subnets</text>
  <text x="410" y="394" class="small">10.0.3.0/24</text>
  <text x="410" y="412" class="small">10.0.4.0/24</text>

  <rect x="594" y="342" width="210" height="340" class="zone-app"/>
  <text x="618" y="374" class="label">Private App Subnets</text>
  <text x="618" y="394" class="small">ECS tasks run without public IPs</text>

  <rect x="834" y="342" width="210" height="340" class="zone-data"/>
  <text x="858" y="374" class="label">Private Data Subnets</text>
  <text x="858" y="394" class="small">RDS subnet group</text>

  <!-- VPC nodes -->
  <rect x="410" y="454" width="130" height="64" class="node"/>
  <circle cx="440" cy="486" r="16" class="green"/>
  <text x="440" y="486" class="icon">IGW</text>
  <text x="464" y="481" class="node-title">Internet</text>
  <text x="464" y="500" class="node-sub">Gateway</text>

  <rect x="410" y="574" width="130" height="64" class="node"/>
  <circle cx="440" cy="606" r="16" class="green"/>
  <text x="440" y="606" class="icon">ALB</text>
  <text x="464" y="601" class="node-title">Application</text>
  <text x="464" y="620" class="node-sub">Load Balancer</text>

  <rect x="410" y="716" width="130" height="64" class="node"/>
  <circle cx="440" cy="748" r="16" class="green"/>
  <text x="440" y="748" class="icon">NAT</text>
  <text x="464" y="743" class="node-title">NAT</text>
  <text x="464" y="762" class="node-sub">Gateway</text>

  <rect x="634" y="454" width="132" height="64" class="node"/>
  <circle cx="664" cy="486" r="16" class="orange"/>
  <text x="664" y="486" class="icon">ECS</text>
  <text x="688" y="481" class="node-title">ECS Cluster</text>
  <text x="688" y="500" class="node-sub">Fargate</text>

  <rect x="634" y="574" width="132" height="76" class="node"/>
  <circle cx="664" cy="612" r="16" class="orange"/>
  <text x="664" y="612" class="icon">APP</text>
  <text x="688" y="601" class="node-title">Rails Web Task</text>
  <text x="688" y="620" class="node-sub">Container :3000</text>
  <text x="688" y="638" class="node-sub">Desired count 1+</text>

  <rect x="870" y="574" width="138" height="76" class="node"/>
  <circle cx="900" cy="612" r="16" class="purple"/>
  <text x="900" y="612" class="icon">RDS</text>
  <text x="924" y="601" class="node-title">RDS PostgreSQL</text>
  <text x="924" y="620" class="node-sub">Multi-AZ</text>
  <text x="924" y="638" class="node-sub">Encrypted</text>

  <rect x="634" y="716" width="132" height="64" class="node"/>
  <circle cx="664" cy="748" r="16" class="green"/>
  <text x="664" y="748" class="icon">LOG</text>
  <text x="688" y="743" class="node-title">VPC Flow</text>
  <text x="688" y="762" class="node-sub">Logs</text>

  <!-- Regional support services -->
  <rect x="1130" y="250" width="244" height="560" class="zone-support"/>
  <text x="1154" y="284" class="label">Regional Services</text>

  <rect x="1160" y="326" width="184" height="58" class="node"/>
  <circle cx="1190" cy="355" r="15" class="orange"/>
  <text x="1190" y="355" class="icon">ECR</text>
  <text x="1214" y="350" class="node-title">Amazon ECR</text>
  <text x="1214" y="369" class="node-sub">Immutable images</text>

  <rect x="1160" y="410" width="184" height="58" class="node"/>
  <circle cx="1190" cy="439" r="15" class="red"/>
  <text x="1190" y="439" class="icon">SEC</text>
  <text x="1214" y="434" class="node-title">Secrets Manager</text>
  <text x="1214" y="453" class="node-sub">DB credentials</text>

  <rect x="1160" y="494" width="184" height="58" class="node"/>
  <circle cx="1190" cy="523" r="15" class="purple"/>
  <text x="1190" y="523" class="icon">CW</text>
  <text x="1214" y="518" class="node-title">CloudWatch</text>
  <text x="1214" y="537" class="node-sub">Logs and alarms</text>

  <rect x="1160" y="578" width="184" height="58" class="node"/>
  <circle cx="1190" cy="607" r="15" class="green"/>
  <text x="1190" y="607" class="icon">S3</text>
  <text x="1214" y="602" class="node-title">S3 ALB Logs</text>
  <text x="1214" y="621" class="node-sub">Access logs</text>

  <rect x="1160" y="662" width="184" height="58" class="node"/>
  <circle cx="1190" cy="691" r="15" class="orange"/>
  <text x="1190" y="691" class="icon">AS</text>
  <text x="1214" y="686" class="node-title">Auto Scaling</text>
  <text x="1214" y="705" class="node-sub">CPU, memory, requests</text>

  <rect x="1160" y="746" width="184" height="58" class="node"/>
  <circle cx="1190" cy="775" r="15" class="red"/>
  <text x="1190" y="775" class="icon">ACM</text>
  <text x="1214" y="770" class="node-title">ACM</text>
  <text x="1214" y="789" class="node-sub">Optional TLS cert</text>

  <!-- Runtime flow -->
  <path d="M238 226 H474 V574" class="line"/>
  <text x="286" y="216" class="small">HTTP / HTTPS</text>

  <path d="M540 606 H634" class="line"/>
  <text x="560" y="596" class="small">target group :3000</text>

  <path d="M700 518 V574" class="line-thin"/>
  <path d="M766 612 H870" class="line"/>
  <text x="790" y="602" class="small">PostgreSQL 5432</text>

  <path d="M634 632 H566 V748 H540" class="line-muted"/>
  <path d="M540 748 H410" class="line-muted"/>
  <text x="552" y="739" class="small">private egress</text>

  <!-- Service dependencies -->
  <path d="M766 596 H1130 V439 H1160" class="line-thin"/>
  <text x="892" y="429" class="small">read DB secret</text>

  <path d="M766 622 H1112 V523 H1160" class="line-thin"/>
  <path d="M766 748 H1112 V523" class="line-thin"/>
  <path d="M1008 612 H1112 V523" class="line-thin"/>
  <text x="938" y="513" class="small">logs / metrics</text>

  <path d="M540 606 H1112 V607 H1160" class="line-thin"/>
  <text x="880" y="596" class="small">ALB access logs</text>

  <path d="M1160 691 H1088 V612 H766" class="line-thin"/>
  <text x="986" y="682" class="small">adjust desired count</text>

  <path d="M1160 775 H1088 V606 H540" class="line-muted"/>
  <text x="912" y="765" class="small">optional HTTPS listener</text>

  <!-- Delivery flow -->
  <path d="M238 440 H1160 V355" class="line-deploy"/>
  <text x="500" y="430" class="small">build and push image</text>

  <path d="M1160 355 H700 V454" class="line-deploy"/>
  <text x="792" y="345" class="small">pull container image</text>

  <path d="M238 556 H314 V218 H350" class="line-deploy"/>
  <text x="280" y="545" class="small">provision infrastructure</text>

  <path d="M238 814 H350" class="line-muted"/>
  <text x="264" y="804" class="small">local validation</text>

  <!-- Legend -->
  <rect x="314" y="834" width="570" height="52" class="node"/>
  <line x1="338" y1="852" x2="394" y2="852" class="line"/>
  <text x="408" y="856" class="small">Runtime traffic / dependency</text>
  <line x1="338" y1="874" x2="394" y2="874" class="line-deploy"/>
  <text x="408" y="878" class="small">CI/CD and Terraform delivery</text>
  <line x1="620" y1="852" x2="676" y2="852" class="line-muted"/>
  <text x="690" y="856" class="small">Optional or local workflow</text>

  <text x="48" y="944" class="subtitle">Static SVG companion to docs/architecture.eraser. Components correspond to Terraform resources in this repository.</text>
</svg>
