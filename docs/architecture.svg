<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1320" viewBox="0 0 2200 1320" role="img" aria-labelledby="title desc">
  <title id="title">OpenStreetMap AWS Cloud Architecture</title>
  <desc id="desc">A clean AWS architecture diagram for OpenStreetMap. It separates runtime traffic, private application and data tiers, managed platform services, and the GitHub Actions deployment workflow.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" viewBox="0 0 12 12">
      <path d="M1 1 L11 6 L1 11 Z" fill="#1f2937"/>
    </marker>
    <marker id="arrowDeploy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" viewBox="0 0 12 12">
      <path d="M1 1 L11 6 L1 11 Z" fill="#b45309"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .page { fill: #f6f8fb; }
      .title { font: 800 46px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #4b5563; }
      .caption { font: 400 15px Arial, sans-serif; fill: #6b7280; }
      .aws-shell { fill: #ffffff; stroke: #d1d5db; stroke-width: 3; rx: 30; filter: url(#shadow); }
      .region-shell { fill: #fff7ed; stroke: #fb923c; stroke-width: 3; rx: 24; }
      .vpc-shell { fill: #f0fdf4; stroke: #22c55e; stroke-width: 3; rx: 24; }
      .lane-public { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2.5; rx: 18; }
      .lane-app { fill: #fff7ed; stroke: #fdba74; stroke-width: 2.5; rx: 18; }
      .lane-data { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2.5; rx: 18; }
      .lane-managed { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2.5; rx: 18; }
      .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .card-flat { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; rx: 16; }
      .card-title { font: 800 22px Arial, sans-serif; fill: #111827; }
      .card-sub { font: 400 17px Arial, sans-serif; fill: #4b5563; }
      .label { font: 800 22px Arial, sans-serif; fill: #1f2937; }
      .small { font: 400 17px Arial, sans-serif; fill: #6b7280; }
      .icon-text { font: 800 16px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .icon-aws { fill: #ff9900; }
      .icon-blue { fill: #2563eb; }
      .icon-green { fill: #16a34a; }
      .icon-purple { fill: #7c3aed; }
      .icon-red { fill: #dc2626; }
      .icon-dark { fill: #111827; }
      .icon-docker { fill: #2496ed; }
      .icon-tf { fill: #7b42bc; }
      .flow { fill: none; stroke: #1f2937; stroke-width: 4; marker-end: url(#arrow); }
      .flow-thin { fill: none; stroke: #6b7280; stroke-width: 3; marker-end: url(#arrow); }
      .flow-soft { fill: none; stroke: #9ca3af; stroke-width: 3; stroke-dasharray: 12 10; marker-end: url(#arrow); }
      .flow-deploy { fill: none; stroke: #b45309; stroke-width: 4; marker-end: url(#arrowDeploy); }
      .flow-label { font: 800 15px Arial, sans-serif; fill: #374151; }
      .deploy-label { font: 800 15px Arial, sans-serif; fill: #92400e; }
      .pill { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.5; rx: 16; }
    </style>
  </defs>

  <rect class="page" width="2200" height="1320"/>
  <text x="72" y="82" class="title">OpenStreetMap AWS Cloud Architecture</text>
  <text x="72" y="124" class="subtitle">A concise view of runtime traffic, private compute and data tiers, managed services, and CI/CD delivery.</text>

  <!-- External runtime actor -->
  <rect x="72" y="250" width="250" height="116" class="card"/>
  <circle cx="126" cy="308" r="32" class="icon-blue"/>
  <text x="126" y="309" class="icon-text">USR</text>
  <text x="178" y="300" class="card-title">Users</text>
  <text x="178" y="330" class="card-sub">HTTPS clients</text>

  <!-- AWS boundary -->
  <rect x="380" y="190" width="1748" height="920" class="aws-shell"/>
  <text x="428" y="244" class="label">AWS Account</text>
  <text x="428" y="274" class="small">Terraform-managed OpenStreetMap infrastructure</text>

  <rect x="428" y="318" width="1652" height="728" class="region-shell"/>
  <text x="476" y="370" class="label">Region: eu-central-1</text>

  <!-- VPC -->
  <rect x="476" y="424" width="1040" height="484" class="vpc-shell"/>
  <text x="524" y="476" class="label">VPC 10.0.0.0/16</text>
  <text x="524" y="506" class="small">Two Availability Zones with public, private application, and private data subnets</text>

  <rect x="524" y="552" width="270" height="264" class="lane-public"/>
  <text x="552" y="592" class="label">Public</text>
  <text x="552" y="620" class="small">ALB and egress</text>

  <rect x="836" y="552" width="300" height="264" class="lane-app"/>
  <text x="864" y="592" class="label">Private App</text>
  <text x="864" y="620" class="small">ECS tasks, no public IP</text>

  <rect x="1178" y="552" width="290" height="264" class="lane-data"/>
  <text x="1206" y="592" class="label">Private Data</text>
  <text x="1206" y="620" class="small">Database subnet group</text>

  <!-- VPC cards -->
  <rect x="562" y="658" width="194" height="90" class="card"/>
  <circle cx="604" cy="703" r="26" class="icon-blue"/>
  <text x="604" y="704" class="icon-text">ALB</text>
  <text x="646" y="695" class="card-title">ALB</text>
  <text x="646" y="725" class="card-sub">:80 / :443</text>

  <rect x="878" y="658" width="216" height="90" class="card"/>
  <circle cx="920" cy="703" r="26" class="icon-aws"/>
  <text x="920" y="704" class="icon-text">ECS</text>
  <text x="962" y="695" class="card-title">ECS Fargate</text>
  <text x="962" y="725" class="card-sub">Rails web :3000</text>

  <rect x="1220" y="658" width="206" height="90" class="card"/>
  <circle cx="1262" cy="703" r="26" class="icon-purple"/>
  <text x="1262" y="704" class="icon-text">RDS</text>
  <text x="1304" y="695" class="card-title">PostgreSQL</text>
  <text x="1304" y="725" class="card-sub">Multi-AZ</text>

  <rect x="562" y="848" width="194" height="86" class="card-flat"/>
  <circle cx="604" cy="891" r="24" class="icon-green"/>
  <text x="604" y="892" class="icon-text">NAT</text>
  <text x="646" y="884" class="card-title">NAT</text>
  <text x="646" y="912" class="card-sub">Gateway</text>

  <rect x="878" y="848" width="216" height="86" class="card-flat"/>
  <circle cx="920" cy="891" r="24" class="icon-green"/>
  <text x="920" y="892" class="icon-text">LOG</text>
  <text x="962" y="884" class="card-title">VPC Flow</text>
  <text x="962" y="912" class="card-sub">Logs</text>

  <!-- Managed services -->
  <rect x="1570" y="424" width="448" height="484" class="lane-managed"/>
  <text x="1612" y="476" class="label">Managed Platform Services</text>
  <text x="1612" y="506" class="small">Security, delivery, observability, and operations</text>

  <rect x="1612" y="560" width="176" height="82" class="card-flat"/>
  <circle cx="1650" cy="601" r="24" class="icon-aws"/>
  <text x="1650" y="602" class="icon-text">ECR</text>
  <text x="1688" y="594" class="card-title">ECR</text>
  <text x="1688" y="622" class="card-sub">Images</text>

  <rect x="1814" y="560" width="164" height="82" class="card-flat"/>
  <circle cx="1852" cy="601" r="24" class="icon-red"/>
  <text x="1852" y="602" class="icon-text">SEC</text>
  <text x="1890" y="594" class="card-title">Secrets</text>
  <text x="1890" y="622" class="card-sub">DB creds</text>

  <rect x="1612" y="682" width="176" height="82" class="card-flat"/>
  <circle cx="1650" cy="723" r="24" class="icon-purple"/>
  <text x="1650" y="724" class="icon-text">CW</text>
  <text x="1688" y="716" class="card-title">CloudWatch</text>
  <text x="1688" y="744" class="card-sub">Logs</text>

  <rect x="1814" y="682" width="164" height="82" class="card-flat"/>
  <circle cx="1852" cy="723" r="24" class="icon-green"/>
  <text x="1852" y="724" class="icon-text">S3</text>
  <text x="1890" y="716" class="card-title">S3</text>
  <text x="1890" y="744" class="card-sub">ALB logs</text>

  <rect x="1612" y="804" width="176" height="82" class="card-flat"/>
  <circle cx="1650" cy="845" r="24" class="icon-aws"/>
  <text x="1650" y="846" class="icon-text">AS</text>
  <text x="1688" y="838" class="card-title">Scaling</text>
  <text x="1688" y="866" class="card-sub">ECS target</text>

  <rect x="1814" y="804" width="164" height="82" class="card-flat"/>
  <circle cx="1852" cy="845" r="24" class="icon-red"/>
  <text x="1852" y="846" class="icon-text">ACM</text>
  <text x="1890" y="838" class="card-title">ACM</text>
  <text x="1890" y="866" class="card-sub">TLS cert</text>

  <!-- Runtime flows -->
  <path d="M322 308 H562 V658" class="flow"/>
  <text x="364" y="292" class="flow-label">Internet traffic</text>

  <path d="M756 703 H878" class="flow"/>
  <text x="780" y="686" class="flow-label">target group</text>

  <path d="M1094 703 H1220" class="flow"/>
  <text x="1118" y="686" class="flow-label">5432</text>

  <path d="M878 724 H802 V891 H756" class="flow-soft"/>
  <text x="780" y="870" class="flow-label">private egress</text>

  <!-- Managed-service flows -->
  <path d="M1094 680 H1534 V601 H1814" class="flow-thin"/>
  <text x="1338" y="584" class="flow-label">read secret</text>

  <path d="M1094 724 H1534 V723 H1612" class="flow-thin"/>
  <path d="M1426 704 H1534 V723" class="flow-thin"/>
  <path d="M1094 891 H1534 V723" class="flow-thin"/>
  <text x="1350" y="708" class="flow-label">logs and metrics</text>

  <path d="M756 724 H1534 V723 H1814" class="flow-thin"/>
  <text x="1338" y="752" class="flow-label">ALB access logs</text>

  <path d="M1612 845 H1534 V703 H1094" class="flow-thin"/>
  <text x="1326" y="832" class="flow-label">scale ECS tasks</text>

  <path d="M1814 845 H1534 V703 H756" class="flow-soft"/>
  <text x="1326" y="864" class="flow-label">optional TLS</text>

  <!-- Deployment workflow -->
  <rect x="72" y="1032" width="2048" height="170" class="card-flat"/>
  <text x="112" y="1080" class="label">Delivery Workflow</text>
  <text x="112" y="1110" class="small">GitHub Actions validates infrastructure, builds the OpenStreetMap image, pushes to ECR, and deploys the ECS task definition.</text>

  <rect x="398" y="1080" width="224" height="74" class="card-flat"/>
  <circle cx="436" cy="1117" r="22" class="icon-dark"/>
  <text x="436" y="1118" class="icon-text">GH</text>
  <text x="474" y="1110" class="card-title">GitHub Actions</text>
  <text x="474" y="1138" class="card-sub">CI/CD</text>

  <rect x="744" y="1080" width="224" height="74" class="card-flat"/>
  <circle cx="782" cy="1117" r="22" class="icon-tf"/>
  <text x="782" y="1118" class="icon-text">TF</text>
  <text x="820" y="1110" class="card-title">Terraform</text>
  <text x="820" y="1138" class="card-sub">fmt / validate</text>

  <rect x="1090" y="1080" width="224" height="74" class="card-flat"/>
  <circle cx="1128" cy="1117" r="22" class="icon-aws"/>
  <text x="1128" y="1118" class="icon-text">ECR</text>
  <text x="1166" y="1110" class="card-title">Push Image</text>
  <text x="1166" y="1138" class="card-sub">immutable SHA tag</text>

  <rect x="1436" y="1080" width="224" height="74" class="card-flat"/>
  <circle cx="1474" cy="1117" r="22" class="icon-aws"/>
  <text x="1474" y="1118" class="icon-text">ECS</text>
  <text x="1512" y="1110" class="card-title">Deploy Service</text>
  <text x="1512" y="1138" class="card-sub">task definition</text>

  <path d="M622 1117 H744" class="flow-deploy"/>
  <path d="M968 1117 H1090" class="flow-deploy"/>
  <path d="M1314 1117 H1436" class="flow-deploy"/>

  <!-- Legend -->
  <rect x="72" y="1240" width="1140" height="54" class="card-flat"/>
  <line x1="110" y1="1267" x2="190" y2="1267" class="flow"/>
  <text x="214" y="1273" class="small">Runtime traffic</text>
  <line x1="420" y1="1267" x2="500" y2="1267" class="flow-deploy"/>
  <text x="524" y="1273" class="small">CI/CD delivery</text>
  <line x1="790" y1="1267" x2="870" y2="1267" class="flow-soft"/>
  <text x="894" y="1273" class="small">Optional / private workflow</text>

  <text x="72" y="1304" class="caption">Static SVG companion to docs/architecture.eraser. Service names map to Terraform resources in this repository.</text>
</svg>
